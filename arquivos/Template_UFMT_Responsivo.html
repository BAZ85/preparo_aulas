<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template UFMT Direito</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .slide {
      position: absolute;
      width: 100vw;
      height: 100vh;
      margin: 0;
      background: #ececec;
      overflow: hidden;
      border: 1px solid #111;
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 13.2vh;
      background: #1f3270;
    }

    .top-gold {
      position: absolute;
      top: 0;
      left: 0;
      width: 1.25vw;
      height: 13.2vh;
      background: #caa43b;
    }

    .logo {
      position: absolute;
      top: 1.5vh;
      right: 7vw;
      width: 6vw;
      height: 11vh;
      object-fit: contain;
      background: transparent;
    }

    .left-line {
      position: absolute;
      top: 16.3vh;
      left: 3.7vw;
      width: 0.75vw;
      height: 76.2vh;
      background: #caa43b;
    }

    .content {
      position: absolute;
      top: 17.5vh;
      left: 5.5vw;
      right: 3.5vw;
      bottom: 9.5vh;
      color: #111;
    }

    .bottom-gold {
      position: absolute;
      bottom: 5.5vh;
      left: 0;
      width: 100%;
      height: 1.1vh;
      background: #caa43b;
    }

    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5.5vh;
      background: #1f3270;
      display: flex;
      align-items: center;
      padding-left: 2.7vw;
      color: #ffffff;
      font-size: 2.5vh;
    }
  </style>
</head>
